<style>
  /* ===================== 学习路径页 map.html ===================== */
  .page.map { max-width: 720px; margin: 0 auto; padding: 20px 20px 60px; }

  /* ---------- 顶栏 ---------- */
  .m-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .m-slogan { font-size: 20px; font-weight: 700; color: var(--text); margin-right: auto; }
  .m-slogan .sub { display: block; font-size: 12px; font-weight: 400; color: var(--text-3); margin-top: 2px; }
  .capsule { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--text); }
  .capsule.xp { color: var(--accent); }
  .capsule.streak { color: #F59E0B; }
  .capsule.hearts { color: var(--bad); }
  .capsule .ic { vertical-align: -3px; }

  /* ---------- 每日目标进度环 ---------- */
  .goal-ring { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px 18px; box-shadow: var(--shadow-card); margin-bottom: 24px; }
  .goal-ring svg { flex: none; }
  .goal-txt .t { font-size: 14px; font-weight: 600; color: var(--text); }
  .goal-txt .s { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  /* ---------- 路径地图 ---------- */
  .unit { margin-bottom: 8px; }
  .unit-banner { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); padding: 16px 18px; box-shadow: var(--shadow-card); animation: cardIn .25s var(--ease) both; }
  .unit-icon { width: 46px; height: 46px; border-radius: 12px; background: #F4F5FD; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none; }
  .unit-meta { flex: 1; min-width: 0; }
  .unit-theme { font-size: 15px; font-weight: 700; color: var(--text); }
  .unit-name { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .unit-hook { font-size: 13px; color: var(--accent); margin-top: 6px; display: flex; align-items: center; gap: 5px; }
  .unit-hook .ic { opacity: .8; }
  .unit.locked .unit-banner { opacity: .55; }

  /* 节点竖直流 */
  .unit-path { display: flex; flex-direction: column; align-items: center; padding: 4px 0 8px; }
  .path-node { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; max-width: 560px; animation: cardIn .25s var(--ease) both; }
  .path-node .rail { position: absolute; left: 23px; top: 0; bottom: 0; width: 2px; background: #E4E7ED; }
  .path-node:first-child .rail { top: 50%; }
  .path-node:last-child .rail { bottom: 50%; }
  .node-btn { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); cursor: pointer; text-align: left; transition: all .15s var(--ease); }
  .node-dot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; color: #fff; font-weight: 700; font-size: 14px; }
  .node-title { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
  .node-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }

  .node-btn.done .node-dot { background: var(--ok); }
  .node-btn.done .node-tag { color: #047857; background: #ECFDF5; }
  .node-btn.done:hover { border-color: var(--ok); }

  .node-btn.current { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(94,106,210,.12); }
  .node-btn.current .node-dot { background: var(--accent); animation: breathe 2s ease-in-out infinite; }
  .node-btn.current .node-tag { color: #fff; background: var(--accent); }
  .node-btn.current:hover { border-color: var(--accent-2); }

  .node-btn.locked { cursor: not-allowed; opacity: .55; }
  .node-btn.locked .node-dot { background: #C7CBD4; }
  .node-btn.locked .node-title { color: var(--text-3); }
  .node-btn.locked .node-tag { color: var(--text-3); background: #F1F2F6; }

  /* 连接线（当前节点往下断开，形成"进行中"视觉） */
  .path-node.current ~ .path-node .rail { background: #E4E7ED; }
  .path-node .rail.done { background: var(--ok); }
</style>

<div class="page map" id="page-map">
  <div class="m-top">
    <div class="m-slogan">闯关学 Python<span class="sub">跟着剧情，一课一关</span></div>
    <span class="capsule xp" id="capXp"></span>
    <span class="capsule streak" id="capStreak"></span>
    <span class="capsule hearts" id="capHearts"></span>
  </div>

  <div class="goal-ring" id="goalRing">
    <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
      <circle cx="23" cy="23" r="19" fill="none" stroke="#E9EBF0" stroke-width="5"></circle>
      <circle id="goalArc" cx="23" cy="23" r="19" fill="none" stroke="#5E6AD2" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 23 23)"></circle>
    </svg>
    <div class="goal-txt">
      <div class="t">今日目标</div>
      <div class="s" id="goalTxt">0 / 20 XP</div>
    </div>
  </div>

  <div class="units" id="units"></div>
</div>

<script src="ui/pages/_shared.js"></script>
<script>
(function () {
  'use strict';
  var App = window.App;
  var UI = window.PyGoUI;
  var state = App.state;

  var api = UI.bindPage(onState);

  function onState(s) {
    renderCapsules(s);
    renderGoal(s);
    renderUnits(s);
  }

  function renderCapsules(s) {
    document.getElementById('capXp').innerHTML = UI.icon('bolt', 15) + (s.xp || 0) + ' XP';
    document.getElementById('capStreak').innerHTML = UI.icon('flame', 15) + (s.streak || 0) + ' 连胜';
    document.getElementById('capHearts').innerHTML = UI.heartSvg(true, 15) + (s.hearts || 0);
  }

  function renderGoal(s) {
    var goal = s.dailyGoal || 1;
    var xp = s.dailyXp || 0;
    var pct = Math.min(1, xp / goal);
    var arc = document.getElementById('goalArc');
    if (arc) arc.style.strokeDashoffset = (119.4 * (1 - pct)).toFixed(1);
    document.getElementById('goalTxt').textContent = xp + ' / ' + goal + ' XP';
  }

  function renderUnits(s) {
    var wrap = document.getElementById('units');
    var units = s.units || [];
    var html = '';
    units.forEach(function (u, ui) {
      var locked = !!u.locked;
      var banner = '<div class="unit-banner" style="animation-delay:' + (ui * 80) + 'ms">' +
        '<div class="unit-icon">' + UI.esc(u.icon || '📘') + '</div>' +
        '<div class="unit-meta">' +
          '<div class="unit-theme">' + UI.esc(u.story && u.story.theme ? u.story.theme : u.name) + '</div>' +
          '<div class="unit-name">' + UI.esc(u.name || '') + '</div>' +
          (u.story && u.story.hook ? '<div class="unit-hook">' + UI.icon('star', 14) + UI.esc(u.story.hook) + '</div>' : '') +
        '</div></div>';
      html += '<div class="unit' + (locked ? ' locked' : '') + '">' + banner;

      var path = '<div class="unit-path">';
      (u.lessons || []).forEach(function (l, li) {
        var st = l.status;
        var dot = '';
        var tag = '';
        var cls = 'node-btn';
        if (st === 'done') { cls += ' done'; dot = UI.icon('check', 16); tag = '已完成'; }
        else if (st === 'current') { cls += ' current'; dot = UI.icon('play', 16); tag = '开始学习'; }
        else { cls += ' locked'; dot = UI.icon('lock', 15); tag = '未解锁'; }
        path += '<div class="path-node" style="animation-delay:' + ((ui * 5 + li) * 60) + 'ms">' +
          '<span class="rail"></span>' +
          '<button class="' + cls + '" data-id="' + UI.esc(l.id) + '">' +
            '<span class="node-dot">' + dot + '</span>' +
            '<span class="node-title">' + UI.esc(l.title) + '</span>' +
            '<span class="node-tag">' + tag + '</span>' +
          '</button></div>';
      });
      path += '</div>';
      html += path + '</div>';
    });
    wrap.innerHTML = html;

    wrap.querySelectorAll('.node-btn').forEach(function (btn) {
      if (btn.classList.contains('locked')) return;
      btn.addEventListener('click', function () {
        App.actions.startLesson(btn.getAttribute('data-id'));
      });
    });
  }

  // 解锁庆祝
  api.on('unit-unlocked', function () {
    UI.celebrate();
  });

  onState(state);
})();
</script>
